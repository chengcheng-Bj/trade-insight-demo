<!DOCTYPE html>
<html>
<head>
  <title>TikTok 好物 + 实时运费</title>
</head>
<body>
  <h1>实时运费计算</h1>
  <input id="weight" placeholder="重量(kg)">
  <button onclick="calc()">计算</button>
  <div id="result"></div>

  <h2>TikTok 好物</h2>
  <div id="tiktok"></div>

  <script>
    async function calc() {
      const weight = document.getElementById('weight').value;
      const res = await fetch('/api/shipping?weight=' + weight);
      const data = await res.json();
      document.getElementById('result').innerText = '运费: $' + data.cost;
    }
    
    async function loadTiktok() {
      const res = await fetch('/api/tiktok');
      const items = await res.json();
      document.getElementById('tiktok').innerHTML = items.map(i => 
        `<div>${i.title} - ${i.price}</div>`
      ).join('');
    }
    loadTiktok();
  </script>
</body>
</html>
